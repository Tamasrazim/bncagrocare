name: BNC Demo Extraction

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: bnc-demo-sheet
          path: demo.xlsx
          if-no-files-found: error
