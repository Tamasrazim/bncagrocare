name: Extract BNC product list

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ !hashFiles('product-list.txt') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OCR
        run: |
          sudo apt-get update -y
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng imagemagick

      - name: OCR product image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ocr_work

          identify unnamed.jpg | tee ocr_work/image-info.txt || true

          magick unnamed.jpg -colorspace Gray -resize 250% -auto-level ocr_work/gray.png
          magick ocr_work/gray.png -threshold 78% ocr_work/thresh.png

          for f in unnamed.jpg ocr_work/gray.png ocr_work/thresh.png; do
            base="$(basename "$f" | sed 's/\\..*$//')"
            tesseract "$f" "ocr_work/$base" --oem 3 --psm 6 2>/dev/null || true
            tesseract "$f" "ocr_work/${base}_sparse" --oem 3 --psm 11 2>/dev/null || true
          done

          cat ocr_work/*.txt > ocr_work/all-ocr.txt

          python3 - <<'PY'
          import re
          from pathlib import Path

          raw = Path("ocr_work/all-ocr.txt").read_text(errors="ignore")
          lines = []
          for line in raw.splitlines():
              line = re.sub(r"\\s+", " ", line).strip()
              if line and line not in lines:
                  lines.append(line)

          units = re.compile(
              r"(?i)\\b(?:\\d+(?:[.,]\\d+)?|\\d+\\s*[xX]\\s*\\d+)"
              r"\\s*(?:ml|mL|l|L|gm|g|kg|mg|%|pcs?|pc|tablet(?:s)?|capsule(?:s)?|"
              r"bottle(?:s)?|box(?:es)?|pack(?:s)?|packet(?:s)?|sachet(?:s)?|bag(?:s)?|"
              r"ampoule(?:s)?|vial(?:s)?|tube(?:s)?)\\b"
          )

          selected = []
          for i, line in enumerate(lines):
              if units.search(line):
                  if line not in selected:
                      selected.append(line)
                  if i > 0:
                      prev = lines[i-1]
                      if len(prev) >= 3 and not re.search(r"(?i)^(sl|no|name|pack|size|rate|price|product|item)\\b", prev):
                          if prev not in selected:
                              selected.append(prev)

          cleaned = []
          for line in selected:
              if re.fullmatch(r"[-_=:. /\\d]+", line):
                  continue
              if re.search(r"(?i)^(sl|sr|no|name|pack(?:ing)?|size|rate|price|product|item)$", line):
                  continue
              cleaned.append(line)

          Path("product-list.txt").write_text(
              "BNC AgroCare — Product names and pack size info\\n\\n" +
              "\\n".join(f"{i}. {line}" for i, line in enumerate(cleaned, 1)) +
              "\\n",
              encoding="utf-8",
          )
          Path("ocr_work/cleaned-lines.txt").write_text("\\n".join(cleaned) + "\\n", encoding="utf-8")
          PY

      - name: Save OCR result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-list.txt
          git commit -m "Extract BNC product names and pack sizes"
          git push origin HEAD:main

      - name: Upload OCR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bnc-product-ocr
          path: |
            product-list.txt
            ocr_work/all-ocr.txt
            ocr_work/cleaned-lines.txt
            ocr_work/image-info.txt
          if-no-files-found: ignore
